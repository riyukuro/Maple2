syntax = "proto3";

package maple2.server.world.service;

import "google/protobuf/empty.proto";
import "common.proto";
import "sync.proto";

// The world service definition.
service World {
  // Migrate out of a server.
  rpc MigrateOut(MigrateOutRequest) returns (MigrateOutResponse);
  // Migrate into a server.
  rpc MigrateIn(MigrateInRequest) returns (MigrateInResponse);
  // Cross field
  rpc Field(maple2.FieldRequest) returns (maple2.FieldResponse);
  // Retrieve information about channels.
  rpc Channels(ChannelsRequest) returns (ChannelsResponse);
  // Send a chat message.
  rpc Chat(maple2.ChatRequest) returns (maple2.ChatResponse);
  // Manage buddy list.
  rpc Buddy(maple2.BuddyRequest) returns (maple2.BuddyResponse);
  // Manage guild.
  rpc GuildInfo(GuildInfoRequest) returns (GuildInfoResponse);
  rpc Guild(GuildRequest) returns (GuildResponse);
  // Manage party.
  rpc PartyInfo(PartyInfoRequest) returns (PartyInfoResponse);
  rpc Party(PartyRequest) returns (PartyResponse);
  rpc PartySearchInfo(PartySearchInfoRequest) returns (PartySearchInfoResponse);
  rpc PartySearch(PartySearchRequest) returns (PartySearchResponse);
  // Manage club.
  rpc ClubInfo(maple2.ClubInfoRequest) returns (maple2.ClubInfoResponse);
  rpc Club(ClubRequest) returns (ClubResponse);
  // Manage group chat.
  rpc GroupChatInfo(GroupChatInfoRequest) returns (GroupChatInfoResponse);
  rpc GroupChat(GroupChatRequest) returns (GroupChatResponse);
  // Retrieve player info from online player.
  rpc PlayerInfo(maple2.PlayerInfoRequest) returns (maple2.PlayerInfoResponse);
  rpc AccountInfo(maple2.PlayerInfoRequest) returns (maple2.PlayerInfoResponse);
  // Update player info
  rpc UpdatePlayer(maple2.PlayerUpdateRequest) returns (maple2.PlayerUpdateResponse);
  // Notify character about new mail.
  rpc MailNotification(maple2.MailNotificationRequest) returns (maple2.MailNotificationResponse);
  // Daily/weekly resets
  rpc GameReset(maple2.GameResetRequest) returns (maple2.GameResetResponse);
  // Black Market
  rpc BlackMarket(BlackMarketRequest) returns (BlackMarketResponse);
  // Time Events
  rpc TimeEvent(TimeEventRequest) returns (TimeEventResponse);
  // Add channel
  rpc AddChannel(AddChannelRequest) returns (AddChannelResponse);
  // Marriage
  rpc Marriage(maple2.MarriageRequest) returns (maple2.MarriageResponse);
  // PlayerWarp
  rpc PlayerWarp(maple2.PlayerWarpRequest) returns (maple2.PlayerWarpResponse);
  // CharacterInfo: the profile of a player on another channel
  rpc CharacterInfo(maple2.CharacterInfoRequest) returns (maple2.CharacterInfoResponse);
  // Admin
  rpc Admin(maple2.AdminRequest) returns (maple2.AdminResponse);
  // Buff
  rpc PlayerConfig(PlayerConfigRequest) returns (PlayerConfigResponse);
  // Disconnect
  rpc Disconnect(maple2.DisconnectRequest) returns (maple2.DisconnectResponse);
  // Acquire and release locks for database operations.
  rpc AcquireLock (LockRequest) returns (LockResponse);
  rpc ReleaseLock (LockRequest) returns (LockResponse);
  // Field plot
  rpc UpdateFieldPlot(maple2.FieldPlotRequest) returns (maple2.FieldPlotResponse);
  // Rank duel queue (Pvp 14/15/16) and the end of a match.
  rpc Pvp(PvpRequest) returns (PvpResponse);
}

enum Server {
  LOGIN = 0;
  GAME = 1;
}

message MigrateOutRequest {
  int64 account_id = 1;
  int64 character_id = 2;
  string machine_id = 3;
  Server server = 4;

  // If channel is not specified, one will be determined by the world server.
  optional int32 channel = 5;
  optional bool instanced_content = 6;

  optional int32 map_id = 7;
  optional int32 portal_id = 8;
  optional int64 owner_id = 9;
  optional int32 room_id = 10;
  optional float position_x = 11;
  optional float position_y = 12;
  optional float position_z = 13;
  optional MigrationType type = 14;
  // The summoned pet's item uid, 0 for none; the target game server summons it again.
  int64 pet_uid = 15;
}

enum MigrationType {
  NORMAL = 0;
  DECOR_PLANNER = 1;
  MODEL_HOME = 2;
  BLUEPRINT_DESIGNER = 3;
  DUNGEON = 4;
  PVP_MATCH = 5;
}

message MigrateOutResponse {
  string ip_address = 1;
  int32 port = 2;
  int32 channel = 3;
  fixed64 token = 4;
}

message MigrateInRequest {
  int64 account_id = 1;
  fixed64 token = 3;
  string machine_id = 4;
  int32 channel = 5;
  int32 map_id = 6;
  int64 owner_id = 7;
}

message MigrateInResponse {
  int64 character_id = 1;
  int32 channel = 2;
  int32 map_id = 3;
  int32 portal_id = 4;
  int64 owner_id = 5;
  int32 room_id = 6;
  float position_x = 7;
  float position_y = 8;
  float position_z = 9;
  MigrationType type = 10;
  int64 pet_uid = 11;
}

message ChannelsRequest {}

message ChannelsResponse {
  repeated int32 channels = 1;
}

message GuildInfo {
  message Member {
    int64 character_id = 1;
    string message = 2;
    int32 rank = 3;
    int64 join_time = 4;
    int64 login_time = 5;
    int64 checkin_time = 6;
    int64 donation_time = 7;
    int32 weekly_contribution = 8;
    int32 total_contribution = 9;
    int32 daily_donation_count = 10;
  }
  message Rank {
    string name = 1;
    int32 permission = 2;
  }
  message Buff {
    int32 id = 1;
    int32 level = 2;
    int64 expiry_time = 3;
  }
  message Event {
    int32 id = 1;
    int32 time = 2;
  }
  message Poster {
    int32 id = 1;
    string picture = 2;
    int64 owner_id = 3;
    string owner_name = 4;
    int64 resource_id = 5;
  }
  message Npc {
    int32 type = 1;
    int32 level = 2;
  }

  int64 id = 1;
  string name = 2;
  string emblem = 3;
  string notice = 4;
  int64 creation_time = 5;
  int32 focus = 6;
  int32 experience = 7;
  int32 funds = 8;
  int32 house_rank = 9;
  int32 house_theme = 10;
  bool listed = 17;

  repeated Member members = 11;
  repeated Rank ranks = 12;
  repeated Buff buffs = 13;
  // The events opened since World started, with the time of the last opening.
  repeated Event events = 14;
  repeated Poster posters = 15;
  repeated Npc npcs = 16;
  // bank
}

message GuildInfoRequest {
  int64 guild_id = 1;
}

message GuildInfoResponse {
  optional GuildInfo guild = 1;
}

message GuildRequest {
  message Create {
    string guild_name = 1;
  }
  message Disband {
    int64 guild_id = 1;
  }
  message Invite {
    int64 guild_id = 1;
    int64 receiver_id = 2;
  }
  message RespondInvite {
    int64 guild_id = 1;
    bool accepted = 2;
  }
  message Leave {
    int64 guild_id = 1;
  }
  message Expel {
    int64 guild_id = 1;
    int64 receiver_id = 2;
  }
  message UpdateMember {
    int64 guild_id = 1;
    int64 character_id = 2;
    optional int32 rank = 3;
    optional string message = 4;
  }
  message CheckIn {
    int64 guild_id = 1;
  }
  message UpdateLeader {
    int64 guild_id = 1;
    int64 leader_id = 2;
  }
  message UpdateNotice {
    int64 guild_id = 1;
    string message = 2;
  }
  message UpdateRank {
    int64 guild_id = 1;
    int32 rank_id = 2;
    string name = 3;
    int32 permission = 4;
  }
  message UpdateFocus {
    int64 guild_id = 1;
    bool listed = 2;
    int32 focus = 3;
  }
  message UpdateEmblem {
    int64 guild_id = 1;
    string emblem = 2;
  }
  message UpdatePoster {
    int64 guild_id = 1;
    int32 id = 2;
    string picture = 3;
    int64 owner_id = 4;
    string owner_name = 5;
    int64 resource_id = 6;
  }
  message Apply {
    int64 guild_id = 1;
  }
  // Guild 92: the master raises a guild skill by one level.
  message UpgradeBuff {
    int64 guild_id = 1;
    int32 buff_id = 2;
  }
  // Guild 90: the master uses a guild skill; the fund pays its cost.
  message UseBuff {
    int64 guild_id = 1;
    int32 buff_id = 2;
  }
  // Guild 99: a member with the mini game right opens a guild event.
  message OpenEvent {
    int64 guild_id = 1;
    int32 event_id = 2;
  }
  // A guild recall scroll: call the other members to the requestor.
  message Recall {
    int64 guild_id = 1;
    int32 map_id = 2;
    int64 end_time = 3;
  }
  // The requestor earned a trophy grade: Guild 35 to every member.
  message TrophyNotice {
    int64 guild_id = 1;
    int32 trophy_id = 2;
    int32 grade = 3;
    bool last_grade = 4;
  }
  // A quest reward of the requestor for the guild (completeReward guildExp and guildFund).
  message AddExpFund {
    int64 guild_id = 1;
    int32 exp = 2;
    int32 fund = 3;
  }
  // A guild shop buy paid from the guild fund: only the master may spend it.
  message SpendFund {
    int64 guild_id = 1;
    int32 amount = 2;
  }
  // Guild 101: the master raises the guild house by one level, with the theme chosen for it.
  message UpgradeHouse {
    int64 guild_id = 1;
    int32 theme = 2;
  }
  // Guild 102: the master changes the theme of the guild house at its level.
  message ChangeHouseTheme {
    int64 guild_id = 1;
    int32 theme = 2;
  }
  // Guild 71: asks for the sender's turn to send a guild mail (the server's limit of one in 60 seconds).
  message TakeMailTurn {
    int64 guild_id = 1;
  }
  // Guild 114: the master raises a guild NPC by one level.
  message UpgradeNpc {
    int64 guild_id = 1;
    int32 type = 2;
  }
  // Guild 113: count donations, worth fund in all for the guild fund.
  message Donate {
    int64 guild_id = 1;
    int32 count = 2;
    int64 fund = 3;
  }
  message CancelApplication {
    // the guild id or the request id, see GuildRules.FindOwnApplication
    int64 id = 1;
  }
  message RespondApplication {
    int64 guild_id = 1;
    int64 applicant_id = 2;
    bool accepted = 3;
  }
  // A guild rename ticket (item function ChangeGuildName): the master gives the guild a new name.
  message Rename {
    int64 guild_id = 1;
    string name = 2;
  }

  int64 requestor_id = 4;
  oneof guild {
    Create create = 1;
    Disband disband = 2;
    Invite invite = 3;
    RespondInvite respond_invite = 5;
    Leave leave = 7;
    Expel expel = 8;
    UpdateMember update_member = 9;
    CheckIn check_in = 10;
    UpdateLeader update_leader = 11;
    UpdateNotice update_notice = 12;
    UpdateEmblem update_emblem = 13;
    UpdatePoster update_poster = 14;
    UpdateRank update_rank = 15;
    UpdateFocus update_focus = 16;
    Apply apply = 17;
    CancelApplication cancel_application = 18;
    RespondApplication respond_application = 19;
    Donate donate = 20;
    UpgradeBuff upgrade_buff = 21;
    UpgradeNpc upgrade_npc = 22;
    UpgradeHouse upgrade_house = 23;
    ChangeHouseTheme change_house_theme = 24;
    TakeMailTurn take_mail_turn = 25;
    UseBuff use_buff = 26;
    OpenEvent open_event = 27;
    Recall recall = 28;
    AddExpFund add_exp_fund = 29;
    SpendFund spend_fund = 30;
    TrophyNotice trophy_notice = 31;
    Rename rename = 32;
  }
}

message GuildResponse {
  oneof Info {
    int64 guild_id = 1;
    GuildInfo guild = 2;
  }

  int32 error = 4;
  // join requests: the request, the guild's name, the applicant's name
  int64 application_id = 5;
  string guild_name = 6;
  string applicant_name = 7;
  // donation: the member's count of today and the time of the last one
  int32 donation_count = 8;
  int64 donation_time = 9;
}

message GroupChatInfoRequest {
  optional int32 group_chat_id = 1;
  optional int64 character_id = 2;
}

message GroupChatInfoResponse {
  repeated GroupChatInfo infos = 3;
}

message PartyInfo {
  message Member {
    int64 character_id = 1;
    int64 join_time = 2;
  }

  int32 id = 1;
  int64 leader_account_id = 2;
  int64 leader_character_id = 3;
  string leader_name = 4;
  int64 creation_time = 5;
  optional bool dungeon_set = 6;
  optional int32 dungeon_id = 7;
  optional int32 dungeon_room_id = 8;
  optional string match_party_name = 9;
  optional int32 match_party_id = 10;
  optional bool is_matching = 11;
  optional bool require_approval = 12;
  repeated Member members = 13;
  optional PartySearchInfo party_search = 14;
  // The kind of the party's dungeon match search (Party 32/33), 0 when not searching.
  int32 dungeon_match_kind = 15;
}

message PartyInfoRequest {
  optional int32 party_id = 1;
  optional int64 character_id = 2;
}

message PartyInfoResponse {
  optional PartyInfo party = 1;
}

message PartyRequest {
  message Create {}

  message Disband {
    int32 party_id = 1;
  }
  message Invite {
    int32 party_id = 1;
    int64 receiver_id = 2;
  }
  message RespondInvite {
    int32 party_id = 1;
    int32 reply = 2;
  }
  message Leave {
    int32 party_id = 1;
  }
  message Kick {
    int32 party_id = 1;
    int64 receiver_id = 2;
  }
  message UpdateLeader {
    int32 party_id = 1;
    optional int64 character_id = 2;
  }
  message ReadyCheck {
    int32 party_id = 1;
  }
  message VoteReply {
    int32 party_id = 1;
    bool reply = 2;
    int32 vote_id = 3;
  }
  message VoteKick {
    int32 party_id = 1;
    int64 target_user_id = 2;
  }
  message JoinByPartySearch {
    int64 party_search_id = 1;
    int32 party_id = 2;
  }
  message SetDungeon {
    int32 party_id = 1;
    int32 dungeon_id = 2;
    int32 dungeon_room_id = 3;
    bool set = 4;
    // The room's maxUserCount: once the room is set the party takes no member past it.
    int32 max_users = 5;
  }
  // A party recall scroll: call the other members to the requestor.
  message Recall {
    int32 party_id = 1;
    int32 map_id = 2;
    int64 end_time = 3;
  }
  // Party 32/33, the dungeon match search: the rooms Game found the requestor may enter, with their user counts.
  message DungeonMatch {
    message Room {
      int32 id = 1;
      int32 min_users = 2;
      int32 max_users = 3;
      bool change_max_users = 4;
    }
    int32 kind = 1;
    repeated Room rooms = 2;
  }
  // Party 34: the search is cancelled (by the leader: the party goes with the members found so far).
  message CancelDungeonMatch {
    int32 party_id = 1;
    int32 kind = 2;
  }
  // RoomDungeon 15/16: the leader, or a player with no party, sends the recruiting notice for a room.
  message DungeonRecruit {
    int32 kind = 1;
    int32 room_id = 2;
    int32 min_level = 3;
    int32 gear_score = 4;
    int32 max_users = 5;
  }
  // Party 39/43: a player joins through the notice's chat link.
  message JoinDungeonRecruit {
    int32 party_id = 1;
    int32 room_id = 2;
  }

  int64 requestor_id = 1;
  oneof party {
    Create create = 2;
    Disband disband = 3;
    Invite invite = 4;
    RespondInvite respond_invite = 5;
    Leave leave = 6;
    Kick kick = 7;
    UpdateLeader update_leader = 8;
    ReadyCheck ready_check = 9;
    VoteReply vote_reply = 10;
    VoteKick vote_kick = 11;
    JoinByPartySearch join_by_party_search = 12;
    SetDungeon set_dungeon = 13;
    Recall recall = 14;
    DungeonMatch dungeon_match = 15;
    CancelDungeonMatch cancel_dungeon_match = 16;
    DungeonRecruit dungeon_recruit = 17;
    JoinDungeonRecruit join_dungeon_recruit = 18;
  }
}

message PartyResponse {
  oneof Info {
    int32 party_id = 1;
    PartyInfo party = 2;
  }

  int32 error = 3;
  reserved 4;
  // A DungeonRecruit refused for the party's cooldown: the time left (Party 40).
  int32 cooldown_milliseconds = 5;
}

message ClubRequest {
  message Create {
    string club_name = 1;
  }

  message NewClubInvite {
    int64 club_id = 1;
    int64 receiver_id = 2;
    int32 reply = 3;
  }

  message Leave {
    int64 club_id = 1;
  }

  message Invite {
    int64 club_id = 1;
    int64 receiver_id = 2;
  }

  message RespondInvite {
    int64 club_id = 1;
    bool accept = 2;
  }

  message Rename {
    int64 club_id = 1;
    string name = 2;
  }

  message ChangeLeader {
    int64 club_id = 1;
    string name = 2;
  }

  message Buff {
    int64 club_id = 1;
    int32 buff_id = 2;
    int32 buff_level = 3;
  }

  // The login server deletes the character requestor_id: it leaves every club it is in first.
  message DeleteCharacter { }

  int64 requestor_id = 1;
  oneof club {
    Create create = 2;
    NewClubInvite new_club_invite = 3;
    Leave leave = 4;
    Invite invite = 5;
    RespondInvite respond_invite = 6;
    Rename rename = 7;
    ChangeLeader change_leader = 8;
    Buff buff = 9;
    DeleteCharacter delete_character = 10;
  }
}

message ClubResponse {
  oneof Info {
    int64 club_id = 1;
    ClubInfo club = 2;
  }

  int32 error = 3;
}

message BlackMarketRequest {
  message Add {
    int64 listing_id = 1;
  }

  message Remove {
    int64 listing_id = 1;
  }

  message Purchase {
    int64 listing_id = 1;
    int64 seller_id = 3;
  }

  message Search {
    repeated string categories = 1;
    int32 min_level = 2;
    int32 max_level = 3;
    int32 job_flag = 4;
    int32 rarity = 5;
    int32 min_enchant_level = 6;
    int32 max_enchant_level = 7;
    int32 min_socket_count = 8;
    int32 max_socket_count = 9;
    string name = 10;
    int32 start_page = 11;
    int32 sort_by = 12;
    repeated StatOption stat_options = 13;
  }

  oneof black_market {
    Add add = 1;
    Search search = 2;
    Remove remove = 3;
    Purchase purchase = 4;
  }
}

message BlackMarketResponse {
  message Search {
    repeated int64 listing_ids = 1;
  }

  oneof BlackMarket {
    Search search = 1;
  }
  int32 error = 2;
}

message StatOption {
  int32 stat_id = 1;
  int32 value = 2;
}

message TimeEventRequest {
  message JoinGlobalPortal {
    int32 event_id = 1;
    int32 index = 2;
  }

  message GetGlobalPortal {}

  message GetActiveWorldBosses {}

  // The SidePopup enter of a field war: the room the player goes to.
  message JoinFieldWar {
    int64 event_id = 1;
    int64 character_id = 2;
  }

  // The field war that is open, for the announce at a field enter; none for a character that joined it.
  message GetFieldWar {
    int64 character_id = 1;
  }

  message WorldBossKilled {
    int32 metadata_id = 1;
    int32 event_id = 2;
    int32 channel = 3;
  }

  oneof TimeEvent {
    JoinGlobalPortal join_global_portal = 1;
    GetGlobalPortal get_global_portal = 2;
    GetActiveWorldBosses get_active_world_bosses = 3;
    WorldBossKilled world_boss_killed = 4;
    JoinFieldWar join_field_war = 5;
    GetFieldWar get_field_war = 6;
  }
}

message TimeEventResponse {
  message ActiveWorldBoss {
    int32 metadata_id = 1;
    int32 event_id = 2;
    int64 spawn_timestamp = 3;
    int64 next_spawn_timestamp = 4;
    repeated int32 alive_channels = 5;
  }

  oneof Info {
    GlobalPortalInfo global_portal_info = 1;
    FieldWarInfo field_war_info = 4;
  }
  int32 error = 2;
  repeated ActiveWorldBoss active_world_bosses = 3;
}

message GlobalPortalInfo {
  int32 event_id = 1;
  int32 metadata_id = 2;
  int32 channel = 3;
  int32 room_id = 4;
  int32 map_id = 5;
  int32 portal_id = 6;
}

message FieldWarInfo {
  int64 event_id = 1;
  int32 field_war_id = 2;
  int32 channel = 3;
  int32 room_id = 4;
  int32 map_id = 5;
}

message AddChannelRequest {
  string game_ip = 1;
  string grpc_game_ip = 2;
  bool instanced_content = 3;
  // The id of a Game server that already runs: it registers again with a World server that was restarted.
  optional int32 channel = 4;
  // Names the Game server process, so that another one on the same address does not take its id over.
  string instance = 5;
}

message AddChannelResponse {
  int32 game_port = 1;
  int32 grpc_port = 2;
  int32 game_channel = 3;
  // The World server already had this channel for this Game server.
  bool known = 4;
}

message PlayerConfigRequest {
  message Save {
    repeated BuffInfo buffs = 1;
    repeated SkillCooldownInfo skill_cooldowns = 2;
    DeathInfo death_info = 3;
  }

  message Get { }

  int64 requester_id = 1;
  oneof player_config {
    Save save = 2;
    Get get = 3;
  }
}

message PlayerConfigResponse {
  repeated BuffInfo buffs = 1;
  repeated SkillCooldownInfo skill_cooldowns = 2;
  DeathInfo death_info = 3;
}

message BuffInfo {
  int32 id = 1;
  int32 level = 2;
  int32 ms_remaining = 3;
  int64 stop_time = 4;
  bool enabled = 5;
  int32 stacks = 6;
}

message SkillCooldownInfo {
  int32 skill_id = 1;
  int32 skill_level = 2;
  int32 group_id = 3;
  int32 ms_remaining = 4;
  int64 stop_time = 5;
  int32 charges = 6;
  int64 recharge_ms = 7;
}

message DeathInfo {
  int32 count = 1;
  int32 ms_remaining = 2;
  int64 stop_time = 3;
}

message LockRequest {
  int64 accountId = 1;
}

message LockResponse {
  string error = 1;
}

// The rank duel queue. requester_id is the character.
message PvpRequest {
  message Register {
    // The character's rank duel rating, for the pairing window.
    int32 rating = 1;
  }
  message Unregister {
  }
  // The join after a match was found: the answer names the match field.
  message Join {
  }
  // The match field ended the match: its characters leave the matchmaker. arena is 0 for a rank duel.
  message End {
    int32 match_id = 1;
    int32 arena = 2;
  }
  // The individual arena queue (Pvp 9 with the arena, 10, 11).
  message ArenaRegister {
    int32 arena = 1;
    // The arena's playerCount (individualarena.xml).
    int32 player_count = 2;
  }
  message ArenaUnregister {
  }
  message ArenaJoin {
  }
  // A rank duel's fight started: it can be watched (the World offers it, Pvp 0x19).
  message Observable {
    int32 match_id = 1;
  }
  int64 requester_id = 1;
  oneof pvp {
    Register register = 2;
    Unregister unregister = 3;
    Join join = 4;
    End end = 5;
    ArenaRegister arena_register = 6;
    ArenaUnregister arena_unregister = 7;
    ArenaJoin arena_join = 8;
    Observable observable = 9;
  }
}

message PvpResponse {
  // Maple2.Model.Game.Pvp.RankDuelError
  int32 error = 1;
  int32 map_id = 2;
  int32 room_id = 3;
  int32 channel = 4;
  // The arena queues' waits in milliseconds by arenaType (on the arena register and unregister answers).
  map<int32, int32> arena_waits = 5;
  // The join is to watch a running rank duel (the character has no match of its own).
  bool observer = 6;
}
