syntax = "proto3";

package maple2.server.channel.service;

import "common.proto";
import "sync.proto";

// The channel service definition.
service Channel {
  // Retrieve information about channels.
  rpc UpdateChannels(ChannelsUpdateRequest) returns (ChannelsUpdateResponse);
  // Manage field
  rpc Field(maple2.FieldRequest) returns (maple2.FieldResponse);
  // Send a chat message.
  rpc Chat(maple2.ChatRequest) returns (maple2.ChatResponse);
  // Manage buddy list.
  rpc Buddy(maple2.BuddyRequest) returns (maple2.BuddyResponse);
  // Update player info
  rpc UpdatePlayer(maple2.PlayerUpdateRequest) returns (maple2.PlayerUpdateResponse);
  // Manage guild.
  rpc Guild(GuildRequest) returns (GuildResponse);
  // Manage party.
  rpc Party(PartyRequest) returns (PartyResponse);
  rpc PartySearch(maple2.PartySearchRequest) returns (maple2.PartySearchResponse);
  // Manage group chat.
  rpc GroupChat(GroupChatRequest) returns (GroupChatResponse);

  // Notify character about new mail.
  rpc MailNotification(maple2.MailNotificationRequest) returns (maple2.MailNotificationResponse);
  // Daily/weekly resets
  rpc GameReset(maple2.GameResetRequest) returns (maple2.GameResetResponse);
  // Black Market
  rpc BlackMarket(BlackMarketRequest) returns (BlackMarketResponse);
  // Manage Club.
  rpc Club(ClubRequest) returns (ClubResponse);
  rpc ClubInfo(maple2.ClubInfoRequest) returns (maple2.ClubInfoResponse);
  // Time Events
  rpc TimeEvent(TimeEventRequest) returns (TimeEventResponse);
  // Game Events
  rpc GameEvent(GameEventRequest) returns (GameEventResponse);
  // Marriage
  rpc Marriage(maple2.MarriageRequest) returns (maple2.MarriageResponse);
  // PlayerWarp
  rpc PlayerWarp(maple2.PlayerWarpRequest) returns (maple2.PlayerWarpResponse);
  // CharacterInfo: the profile of a player on another channel
  rpc CharacterInfo(maple2.CharacterInfoRequest) returns (maple2.CharacterInfoResponse);
  // Admin
  rpc Admin(maple2.AdminRequest) returns (maple2.AdminResponse);
  // Disconnect
  rpc Disconnect(maple2.DisconnectRequest) returns (maple2.DisconnectResponse);
  // Heartbeat
  rpc Heartbeat(maple2.HeartbeatRequest) returns (maple2.HeartbeatResponse);
  // Update Field Plots
  rpc UpdateFieldPlot(maple2.FieldPlotRequest) returns (maple2.FieldPlotResponse);
  // The rank duel matchmaker's word to a character on this channel.
  rpc Pvp(PvpNoticeRequest) returns (PvpNoticeResponse);
}

message ChannelsUpdateRequest {
  repeated int32 channels = 1;
}

message ChannelsUpdateResponse {
  int32 error = 1;
}

message GuildRequest {
  message Invite {
    string guild_name = 1;
    int64 sender_id = 2;
    string sender_name = 3;
  }
  message InviteReply {
    string name = 1;
    int32 reply = 2;
  }
  message AddMember {
    int64 character_id = 1;
    string requestor_name = 2;
    int32 rank = 3;
    int64 join_time = 4;
  }
  message RemoveMember {
    int64 character_id = 1;
    string requestor_name = 2;
  }
  message UpdateMember {
    int64 requestor_id = 1;
    int64 character_id = 2;
    optional int32 rank = 3;
    optional string message = 4;
    optional int32 contribution = 5;
    optional int64 check_in_time = 6;
  }
  message UpdateContribution {
    int64 contributorId = 1;
    int32 guild_exp = 2;
    int32 guild_fund = 3;
  }
  message UpdateLeader {
    int64 old_leader_id = 1;
    int64 new_leader_id = 2;
  }
  message UpdateNotice {
    string requestor_name = 1;
    string message = 2;
  }
  message UpdateRank {
    string requestor_name = 1;
    int32 rank_id = 2;
    string name = 3;
    int32 permission = 4;
  }
  message UpdateFocus {
    string requestor_name = 1;
    bool listed = 2;
    int32 focus = 3;
  }
  message UpdateEmblem {
    string requestor_name = 1;
    string emblem = 2;
  }
  message UpdatePoster {
    int32 id = 1;
    string picture = 2;
    int64 owner_id = 3;
    string owner_name = 4;
    int64 resource_id = 5;
  }
  // A join request arrived (to the members who may answer it).
  message ApplicationAdded {
    int64 application_id = 1;
    int64 applicant_id = 2;
    int64 creation_time = 3;
  }
  // A join request was withdrawn (to the members who may answer it).
  message ApplicationRemoved {
    int64 application_id = 1;
  }
  // A join request was answered (to the members who may answer it).
  message ApplicationAnswered {
    int64 application_id = 1;
    string requestor_name = 2;
    string applicant_name = 3;
    bool accepted = 4;
  }
  // Guild 55: a guild skill at its new level.
  message UpgradeBuff {
    string requestor_name = 1;
    int32 id = 2;
    int32 level = 3;
    int64 expiry_time = 4;
  }
  // Guild 54: the skill with its time of use, and the effect it gives for the given seconds.
  message UseBuff {
    string requestor_name = 1;
    int32 id = 2;
    int32 level = 3;
    int64 use_time = 4;
    int32 effect_id = 5;
    int32 effect_level = 6;
    int32 duration = 7;
  }
  // Guild 56: the event a member opened, with the time of opening.
  message OpenEvent {
    string requestor_name = 1;
    int32 id = 2;
    int32 time = 3;
  }
  // A guild recall scroll: the caller and the map, offered to the members but the caller (RecallScroll type 1).
  message Recall {
    int64 character_id = 1;
    string name = 2;
    int32 map_id = 3;
    int64 end_time = 4;
  }
  // Guild 57: the guild house at its new level and theme.
  message UpdateHouse {
    string requestor_name = 1;
    int32 rank = 2;
    int32 theme = 3;
  }
  // Guild 59: a guild NPC at its new level.
  message UpgradeNpc {
    string requestor_name = 1;
    int32 type = 2;
    int32 level = 3;
  }
  // The answer, to the applicant.
  message ApplicationResult {
    int64 application_id = 1;
    string guild_name = 2;
    bool joined = 3;
  }
  // Guild 35: a member earned a trophy grade.
  message TrophyNotice {
    string name = 1;
    int32 trophy_id = 2;
    int32 grade = 3;
    bool last_grade = 4;
  }

  int64 guild_id = 1;
  repeated int64 receiver_ids = 2;
  oneof Guild {
    Invite invite = 3;
    InviteReply invite_reply = 4;
    AddMember add_member = 5;
    RemoveMember remove_member = 6;
    UpdateMember update_member = 7;
    UpdateContribution update_contribution = 8;
    UpdateLeader update_leader = 9;
    UpdateNotice update_notice = 10;
    UpdateEmblem update_emblem = 11;
    UpdatePoster update_poster = 12;
    UpdateRank update_rank = 13;
    UpdateFocus update_focus = 14;
    ApplicationAdded application_added = 15;
    ApplicationRemoved application_removed = 16;
    ApplicationAnswered application_answered = 17;
    ApplicationResult application_result = 18;
    UpgradeBuff upgrade_buff = 19;
    UpgradeNpc upgrade_npc = 20;
    UpdateHouse update_house = 21;
    UseBuff use_buff = 22;
    OpenEvent open_event = 23;
    Recall recall = 24;
    TrophyNotice trophy_notice = 25;
  }
}

message GuildResponse {
  int32 error = 1;
}

message PartyRequest {
  message Invite {
    int64 sender_id = 1;
    string sender_name = 2;
  }
  message InviteReply {
    string name = 1;
    int32 reply = 2;
  }
  message AddMember {
    int64 character_id = 1;
    int64 join_time = 2;
  }
  message RemoveMember {
    int64 character_id = 1;
    bool is_kicked = 2;
  }
  message UpdateLeader {
    int64 character_id = 1;
  }
  message Disband {
    int64 character_id = 1;
    // Tell the client even for a party of one (a dungeon match party of one whose search ended).
    bool notify = 2;
  }
  // The receivers moved into this party (a dungeon match merge or join): load it from World in place of theirs.
  message LoadParty { }
  message StartReadyCheck {
    int64 character_id = 1;
  }
  message VoteReply {
    int64 character_id = 1;
    bool reply = 2;
    int32 party_id = 3;
  }
  message EndVote {
    int32 party_id = 1;
  }
  message ExpiredVote {
    int32 party_id = 1;
  }
  message StartVoteKick {
    int64 character_id = 1;
    int64 target_id = 2;
    repeated int64 receiver_ids = 3;
  }
  message CreateSearch {
    int32 party_id = 1;
    PartySearchInfo party_search = 2;
  }
  message SetDungeon {
    int32 party_id = 1;
    int32 dungeon_id = 2;
    int32 dungeon_room_id = 3;
    bool set = 4;
    // The room was made by the dungeon matchmaker: every member gets the enter box (Party 0x1f).
    bool matched = 5;
  }
  // The party's dungeon match search started (registered) or ended.
  message DungeonMatch {
    int32 kind = 1;
    bool registered = 2;
  }
  message Recall {
    int64 character_id = 1;
    string name = 2;
    int32 map_id = 3;
    int64 end_time = 4;
  }
  // The recruiting notice (DungeonHelp 0x0109) of party_id.
  message DungeonRecruit {
    int32 kind = 1;
    string leader_name = 2;
    int64 leader_account_id = 3;
    int64 leader_id = 4;
    int32 room_id = 5;
    int32 members = 6;
    int32 need_helpers = 7;
    int32 need_members = 8;
  }

  int32 party_id = 1;
  repeated int64 receiver_ids = 2;
  oneof Party {
    Invite invite = 3;
    InviteReply invite_reply = 4;
    AddMember add_member = 5;
    RemoveMember remove_member = 6;
    UpdateLeader update_leader = 7;
    Disband disband = 8;
    StartReadyCheck start_ready_check = 9;
    VoteReply vote_reply = 10;
    EndVote end_vote = 11;
    ExpiredVote expired_vote = 12;
    StartVoteKick start_vote_kick = 13;
    CreateSearch create_search = 14;
    SetDungeon set_dungeon = 15;
    Recall recall = 16;
    DungeonMatch dungeon_match = 17;
    LoadParty load_party = 18;
    DungeonRecruit dungeon_recruit = 19;
  }
}

message PartyResponse {
  int32 error = 1;
}

message BlackMarketRequest {
  message PurchaseResponse {
    int64 seller_id = 1;
  }

  oneof BlackMarket {
    PurchaseResponse purchase_response = 1;
  }
}

message BlackMarketResponse {
  int32 error = 1;
}

message ClubRequest {
  message Create {
    ClubInfo info = 1;
  }

  message RemoveMember {
    int64 character_id = 1;
    // The character was deleted (Club 0x1c) instead of leaving (Club 0x12).
    bool deleted = 2;
  }

  message Disband { }

  message StagedClubInviteReply {
    int32 reply = 1;
    string name = 2;
    int64 character_id = 3;
  }

  message StagedClubFail {
    int32 reply = 1;
  }

  message Establish { }

  message Invite {
    int64 sender_id = 1;
    string sender_name = 2;
    string club_name = 3;
  }

  message AddMember {
    int64 character_id = 1;
    string requestor_name = 2;
    int64 join_time = 3;
  }

  message InviteReply {
    string requestor_name = 1;
    bool accept = 2;
  }

  message UpdateLeader {
    int64 character_id = 1;
  }

  message Rename {
    string name = 1;
    int64 changed_time = 2;
  }

  message UpdateBuff {
    int32 buff_id = 1;
    int32 buff_level = 2;
  }

  int64 club_id = 1;
  repeated int64 receiver_ids = 2;
  oneof Club {
    Create create = 3;
    StagedClubInviteReply staged_club_invite_reply = 4;
    StagedClubFail staged_club_fail = 5;
    Establish establish = 6;
    RemoveMember remove_member = 7;
    Disband disband = 8;
    Invite invite = 9;
    AddMember add_member = 10;
    InviteReply invite_reply = 11;
    UpdateLeader update_leader = 12;
    Rename rename = 13;
    UpdateBuff update_buff = 14;
  }
}

message ClubResponse {
  int32 error = 1;
}

message TimeEventRequest {
  message AnnounceGlobalPortal {
    int32 event_id = 1;
    int32 metadata_id = 2;
  }

  message CloseGlobalPortal {
    int32 event_id = 1;
  }

  message GetField {
    int32 map_id = 1;
    int32 room_id = 2;
  }

  message AnnounceWorldBoss {
    int32 metadata_id = 1;
    int32 event_id = 2;
    int64 end_tick = 3;
    int64 next_spawn_timestamp = 4;
  }

  message CloseWorldBoss {
    int32 metadata_id = 1;
    int32 event_id = 2;
  }

  message WarnWorldBoss {
    int32 metadata_id = 1;
    int32 event_id = 2;
  }

  oneof TimeEvent {
    AnnounceGlobalPortal announce_global_portal = 1;
    CloseGlobalPortal close_global_portal = 2;
    GetField get_field = 3;
    AnnounceWorldBoss announce_world_boss = 4;
    CloseWorldBoss close_world_boss = 5;
    WarnWorldBoss warn_world_boss = 6;
  }
}

message TimeEventResponse {
  int32 error = 1;
  oneof Info {
    FieldInfo field = 2;
  }
}

message FieldInfo {
  int32 map_id = 1;
  int32 room_id = 2;
  int64 owner_id = 3;
  repeated int64 player_ids = 4;
}

message GameEventRequest {
  message Remove {
    int32 event_id = 1;
  }

  message Update {
    int32 event_id = 1;
  }

  message Add {
    int32 event_id = 1;
  }

  oneof GameEvent {
    Remove remove = 1;
    Update update = 2;
    Add add = 3;
  }
}

message GameEventResponse {
  int32 error = 1;
}

message PvpNoticeRequest {
  int64 character_id = 1;
  // true: a match was found (Pvp 16 true). false: the search or the match ended without a duel (Pvp 16 false).
  bool matched = 2;
  // The individual arena of the notice; 0 for the rank duel. matched: Pvp 11 with the arena; not: Pvp 10.
  int32 arena = 3;
  // A rank duel can be watched: every player of the channel outside a PvP field gets Pvp 0x19 (character_id is 0).
  bool observe_offer = 4;
}

message PvpNoticeResponse {
}
